<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f3f4f6]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | {{ site_settings.name|default:"Avingine" }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 text-slate-800">
    <div class="max-w-sm w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 text-center space-y-4">
        <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center mx-auto border border-rose-100">
            <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <div class="space-y-1.5">
            <h1 class="text-lg font-extrabold text-slate-900">Access Denied</h1>
            <p class="text-xs text-slate-500 leading-relaxed">
                You do not have permission to access this page.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'engine:game' %}" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">
                <span>Return to Flight Cockpit</span>
            </a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
